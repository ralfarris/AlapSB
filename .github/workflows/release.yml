name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile AlapSB.exe
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Create ZIP Package
        shell: powershell
        run: |
          Compress-Archive -Path dist\AlapSB.exe -DestinationPath dist\AlapSB-Windows.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AlapSB ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/AlapSB.exe
            dist/AlapSB-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
